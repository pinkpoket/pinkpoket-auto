name: life-release

# 인생ON 보관함에서 하나씩 꺼내 올리기 (Claude 는 일요일에 한 주 치를 몰아 씀)
on:
  schedule:
    # 2026-11-26: GitHub 예약이 몇 시간씩 밀려(저녁 쇼츠가 새벽 4시에 올라감) 창마다 30분 간격으로 여러 번 건다.
    # 창 안에서 처음 도착한 실행만 올리고, 나머지와 창 밖에 늦게 온 실행은 life_release.py 가 건너뛴다.
    - cron: "21,51 22,23 * * *"   # 한국 07:21~08:51 쇼츠 (아침 창 07~11시)
    - cron: "21,51 0,1 * * *"     # 한국 09:21~10:51 쇼츠 (아침 창 예비)
    - cron: "37 0,1,2 * * *"      # 한국 09:37·10:37·11:37 긴 영상 (창 09~13시)
    - cron: "21,51 9,10,11 * * *" # 한국 18:21~20:51 쇼츠 (저녁 창 18~22시)
    # 한국 20:37 긴 영상·11:21 짝 쇼츠 — 2026-11-13 하루 쇼츠 2편·긴 영상 1편으로 줄임 (핑포 결정)
  workflow_dispatch:
    inputs:
      mode:
        description: "short / pair / long / sayeon (사연은 핑포가 미리보기를 보고 허락한 뒤에만 손으로 실행)"
        default: "short"
      auto:
        description: "1 이면 시간 창 규칙을 지킴 (life-timer 가 부를 때)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: life-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 무엇을 꺼낼지
        id: m
        run: |
          M="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "37 0,1,2 * * *"|"37 0 * * *") M=long ;;
            "21,51 22,23 * * *"|"21,51 0,1 * * *"|"21,51 9,10,11 * * *"|"21 22 * * *"|"21 9 * * *") M=short ;;
          esac
          echo "mode=$M" >> $GITHUB_OUTPUT
      - name: 꺼내기
        id: r
        env:
          MODE: ${{ steps.m.outputs.mode }}
          AUTO: ${{ github.event.inputs.auto }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u ai/life_release.py
      - name: 올리고 제작 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add -A life/shorts life/long
          git diff --cached --quiet && exit 0
          git commit -q -m "인생ON 보관함에서 꺼냄 (${{ steps.m.outputs.mode }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          sleep 10  # 방금 올린 커밋이 GitHub 에 반영된 뒤 제작 시작 (2026-11-11 짝 쇼츠가 큐에 걸린 일)
          [ -n "${{ steps.r.outputs.next }}" ] && gh workflow run "${{ steps.r.outputs.next }}" --ref main
          true
