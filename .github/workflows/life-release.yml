name: life-release

# 인생ON 보관함에서 하나씩 꺼내 올리기 (Claude 는 일요일에 한 주 치를 몰아 씀)
on:
  schedule:
    - cron: "21 22 * * *"   # 한국 07:21 쇼츠
    - cron: "37 0 * * *"    # 한국 09:37 긴 영상
    # - cron: "37 11 * * *"   # 한국 20:37 긴 영상 — 2026-11-13 쉼 뒤 하루 1편으로 줄임 (핑포 결정)
    # - cron: "21 2 * * *"    # 한국 11:21 짝 쇼츠 — 2026-11-13 쇼츠 하루 2편으로 줄임 (핑포 결정)
    - cron: "21 9 * * *"    # 한국 18:21 쇼츠
  workflow_dispatch:
    inputs:
      mode:
        description: "short / pair / long / sayeon (사연은 핑포가 미리보기를 보고 허락한 뒤에만 손으로 실행)"
        default: "short"

permissions:
  contents: write
  actions: write

concurrency:
  group: life-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 무엇을 꺼낼지
        id: m
        run: |
          M="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "37 0 * * *"|"37 11 * * *") M=long ;;
            "21 2 * * *") M=pair ;;
            "21 22 * * *"|"21 9 * * *") M=short ;;
          esac
          echo "mode=$M" >> $GITHUB_OUTPUT
      - name: 꺼내기
        id: r
        env:
          MODE: ${{ steps.m.outputs.mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u ai/life_release.py
      - name: 올리고 제작 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add -A life/shorts life/long
          git diff --cached --quiet && exit 0
          git commit -q -m "인생ON 보관함에서 꺼냄 (${{ steps.m.outputs.mode }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          sleep 10  # 방금 올린 커밋이 GitHub 에 반영된 뒤 제작 시작 (2026-11-11 짝 쇼츠가 큐에 걸린 일)
          [ -n "${{ steps.r.outputs.next }}" ] && gh workflow run "${{ steps.r.outputs.next }}" --ref main
          true
