name: long-weekly

# 인생ON 일요일 '몰아 듣기' 모음 영상: 이번 주 긴 영상을 이어 붙여 1편 더 올린다 (대본 새로 안 씀, 2026-11-08 핑포 결정)
on:
  schedule:
    - cron: "41 5 * * 0"   # 한국 일요일 14:41
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 만들기만 (업로드 안 함)"
        default: "0"

permissions:
  contents: write
  actions: read

concurrency:
  group: long-life
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CHANNEL: life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치 (무료)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra > /dev/null
          pip install -q edge-tts==7.3.1 requests pillow
      - name: 이번 주 영상 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/art
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w long-life.yml -L 60 --json databaseId,createdAt,conclusion \
                       -q ".[] | select(.createdAt > \"$since\") | .databaseId"); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n long-video -D "/tmp/art/$id" 2>/dev/null && echo "받음: $id" || true
          done
          find /tmp/art -name '*.mp4' -exec ls -la {} \;
          df -h . | tail -1
      - name: 모음 만들기 + 업로드
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.LIFE_YOUTUBE_REFRESH_TOKEN }}
          YT_CHANNEL_ID: "UCkN5Ws9cI_B8fyE71-dl__Q"
          YT_PRIVACY: public
          ART: /tmp/art
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python -u life/make_weekly.py
      - name: 시험 결과 보관
        if: ${{ inputs.dry_run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-test
          path: |
            life/long/_weekly/weekly.mp4
            life/long/_out/weekly-thumb.jpg
            life/long/_weekly/thumb.jpg
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add -A life/data/weekly_log.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "인생ON 일요일 몰아 듣기 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
