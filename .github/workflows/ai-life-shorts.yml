name: ai-life-shorts-write

# 구글 Gemini(무료)가 인생ON 쇼츠 대본을 쓰고 → 바로 영상 제작 워크플로를 부른다.
# Claude 예약 작업 대신 (2026-11-06, 크레딧 아끼기)
on:
  schedule:
    - cron: "47 21 * * *"   # 한국 06:47
    - cron: "47 1 * * *"    # 한국 10:47
    - cron: "47 8 * * *"    # 한국 17:47
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 대본만 써서 보여주기 (올리지 않음)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-life-shorts
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Gemini로 대본 쓰기
        env:
          JOB: life-shorts
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u ai/gemini_write.py
      - name: 대본 보기
        run: cat life/shorts/queue/*.json || true
      - name: 대기열에 올리고 영상 제작 시작
        if: ${{ github.event.inputs.dry_run != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add life/shorts/queue
          git diff --cached --quiet && exit 0
          git commit -m "인생ON 쇼츠 대본 (Gemini)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          gh workflow run shorts-life.yml --ref main
