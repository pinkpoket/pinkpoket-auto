name: shorts-life-make

on:
  # life/shorts/queue/ 에 새 대본이 올라오면 영상 제작 + 인생ON 채널 업로드
  push:
    branches: [main]
    paths: ["life/shorts/queue/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shorts-life
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    env:
      CHANNEL: life
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치 (무료)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra > /dev/null
          pip install -q edge-tts==7.3.1 requests pillow
      - name: 쇼츠 만들기 + 유튜브 업로드
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.LIFE_YOUTUBE_REFRESH_TOKEN }}
          YT_CHANNEL_ID: "UCkN5Ws9cI_B8fyE71-dl__Q"
          # 핑크포켓님만 먼저 볼 수 있게 비공개(private)로 올림. 확인 후 life-publish 로 공개 전환
          YT_PRIVACY: private
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ vars.LIFE_CF_ACCOUNT_ID || vars.NEWS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.LIFE_CF_API_TOKEN || secrets.NEWS_CF_API_TOKEN }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
        run: python -u shorts/make_short.py
      - name: 영상 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-life-videos
          path: shorts/_out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: 처리 기록 저장
        if: always()
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add -A life/shorts/queue life/shorts/done life/data/shorts_log.json life/data/bg_cache
          git diff --cached --quiet && exit 0
          git commit -m "인생ON 쇼츠 제작 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
