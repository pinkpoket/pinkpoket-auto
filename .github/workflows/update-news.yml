name: blog-news-update

# 이미 발행된 오늘뉴스 글을 다시 만들어 덮어쓴다 (사진 0장으로 올라간 글에 사진 넣기 등).
# news/data/update_queue.txt 에 news/posts/ 파일 이름을 한 줄에 하나씩 적으면 돈다.
# 사진을 아직 못 만든 글은 큐에 남겨 두고, 매일 오전 9시 10분(한국 시간, AI 사진 한도가 풀린 뒤) 다시 시도한다.
on:
  push:
    branches: [main]
    paths: ["news/data/update_queue.txt"]
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CHANNEL: news
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 큐 확인
        id: q
        run: |
          if grep -qv '^#' news/data/update_queue.txt 2>/dev/null && grep -v '^#' news/data/update_queue.txt | grep -q '[^[:space:]]'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "고칠 글이 없어요"
          fi
      - uses: actions/setup-python@v5
        if: steps.q.outputs.run == '1'
        with:
          python-version: "3.12"
      - name: git 설정
        if: steps.q.outputs.run == '1'
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
      - name: 이미지 만들기 (무료 AI)
        if: steps.q.outputs.run == '1'
        env:
          CF_ACCOUNT_ID: ${{ vars.NEWS_CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.NEWS_CF_API_TOKEN || secrets.CF_API_TOKEN }}
        run: python -u make_images.py
      - name: 이미지 올리기
        if: steps.q.outputs.run == '1'
        id: img
        run: |
          git add news/images 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "뉴스 블로그 이미지 추가"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 발행된 글 고쳐 올리기
        if: steps.q.outputs.run == '1'
        env:
          NEED_IMAGE: "1"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: "5147989058215304792"
          YOUTUBE_CHANNEL_URL: "https://www.youtube.com/channel/UC3QKRPjjKXiPWVKxfi5vSTQ"
          THREADS_URL: ${{ vars.THREADS_URL }}
          IMAGES_SHA: ${{ steps.img.outputs.sha }}
        run: python -u update_posts.py
      - name: 큐·기록 저장
        if: always() && steps.q.outputs.run == '1'
        run: |
          git add news/data/update_queue.txt news/data/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "뉴스 수정 큐 처리"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
