name: yt-fix

# 이미 올라간 쇼츠에 링크 댓글 달기 + 채널 소개글에 블로그 주소 넣기 (수동 실행)
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shorts-make
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - name: 링크 댓글 + 채널 소개
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: python -u shorts/yt_fix.py
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add data/shorts_log.json
          git diff --cached --quiet && exit 0
          git commit -m "쇼츠 링크 댓글 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
