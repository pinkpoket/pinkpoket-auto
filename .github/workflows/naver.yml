name: naver-prepare

on:
  push:
    branches: [main]
    paths: ["naver/jobs/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: naver-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # naver_fix_sha.py 가 옛 커밋에 사진이 있는지 확인함
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git 설정
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
      - name: 네이버 원고 사진·쿠팡 링크 만들기
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          pip install -q requests pillow
          python -u naver_bot.py
          python -u ai/naver_stock.py
      - name: 결과 올리기
        run: |
          git add naver images/naver 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "네이버 원고 준비 결과"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
      - name: 사진 주소 커밋 번호 확인·고치기
        # pull --rebase 로 사진 커밋 번호가 바뀌면 result.json 주소가 없는 커밋을 가리킴 → 실제 번호로 고침
        run: |
          python -u ai/naver_fix_sha.py
          git add naver/jobs 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "네이버 사진 주소 커밋 번호 고침"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
