name: channel-analyze

on:
  # 직접 실행: 유튜브 채널의 공개 영상 목록(제목·조회수·길이·날짜)을 모아 analysis/ 에 저장
  workflow_dispatch:
    inputs:
      url:
        description: "채널 주소 (예: https://www.youtube.com/@인생ON)"
        required: true
      name:
        description: "저장 폴더 이름 (영어, 예: insaeng-on)"
        required: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -U yt-dlp requests
      - name: 영상 목록 모으기
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p "analysis/$NAME"
          for tab in videos shorts streams; do
            yt-dlp --flat-playlist -J --extractor-args "youtubetab:approximate_date" "$URL/$tab" > "analysis/$NAME/$tab.json" 2> "analysis/$NAME/$tab.err" || echo "{}" > "analysis/$NAME/$tab.json"
            echo "$tab: $(python -c "import json;print(len((json.load(open('analysis/$NAME/$tab.json')) or {}).get('entries') or []))" 2>/dev/null) 개"; tail -2 "analysis/$NAME/$tab.err"
          done
          python - <<'PY'
          # 영상별 자세한 숫자(날짜·길이·좋아요·댓글)는 YouTube Data API 로 (읽기만, 공개 정보)
          import json, os, requests
          name = os.environ["NAME"]; base = f"analysis/{name}"
          ids = []
          for tab in ("videos", "shorts", "streams"):
              try:
                  d = json.load(open(f"{base}/{tab}.json")) or {}
              except Exception:
                  continue
              ids += [(tab, e["id"]) for e in d.get("entries") or [] if e.get("id")]
          tok = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": os.environ["GOOGLE_CLIENT_ID"], "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"], "grant_type": "refresh_token"}, timeout=30).json()["access_token"]
          tabs = dict((v, t) for t, v in ids); out = []
          for i in range(0, len(ids), 50):
              chunk = ",".join(v for _, v in ids[i:i + 50])
              r = requests.get("https://www.googleapis.com/youtube/v3/videos",
                               params={"part": "snippet,contentDetails,statistics", "id": chunk},
                               headers={"Authorization": f"Bearer {tok}"}, timeout=30).json()
              for it in r.get("items", []):
                  sn, st = it["snippet"], it.get("statistics", {})
                  out.append({"id": it["id"], "tab": tabs.get(it["id"]), "title": sn.get("title"),
                              "description": (sn.get("description") or "")[:600], "published": sn.get("publishedAt"),
                              "tags": sn.get("tags"), "duration": it["contentDetails"].get("duration"),
                              "views": int(st.get("viewCount", 0)), "likes": int(st.get("likeCount", 0) or 0),
                              "comments": int(st.get("commentCount", 0) or 0)})
          json.dump(out, open(f"{base}/details.json", "w"), ensure_ascii=False, indent=1)
          print(f"영상 {len(out)}개 수집")
          PY
      - name: 저장
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add analysis
          git diff --cached --quiet && exit 0
          git commit -m "채널 분석 자료 수집: ${{ inputs.name }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
