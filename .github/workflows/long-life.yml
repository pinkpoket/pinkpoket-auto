name: long-life-make

on:
  # life/long/queue/ 에 새 긴 영상 대본이 올라오면 제작 + 인생ON 채널 업로드
  push:
    branches: [main]
    paths: ["life/long/queue/**"]
  workflow_dispatch:
    inputs:
      test_file:
        description: "시험 제작만 할 대본 이름 (done 또는 bank 에서 찾음, 업로드 안 함)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: long-life
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    env:
      CHANNEL: life
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 최신 main 으로 (보관함에서 막 꺼낸 대본을 놓치지 않게, 2026-11-11)
        run: git fetch -q origin main && git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치 (무료)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra > /dev/null
          pip install -q edge-tts==7.3.1 requests pillow
      - name: 긴 영상 만들기 + 유튜브 업로드
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.LIFE_YOUTUBE_REFRESH_TOKEN }}
          YT_CHANNEL_ID: "UCkN5Ws9cI_B8fyE71-dl__Q"
          # 2026-11-03 핑크포켓님 확인 완료 → 바로 공개
          YT_PRIVACY: public
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ vars.LIFE_CF_ACCOUNT_ID || vars.NEWS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.LIFE_CF_API_TOKEN || secrets.NEWS_CF_API_TOKEN }}
        run: |
          if [ -n "${{ inputs.test_file }}" ]; then
            mkdir -p /tmp/q && (cp "life/long/done/${{ inputs.test_file }}" /tmp/q/ 2>/dev/null || cp "life/long/bank/${{ inputs.test_file }}" /tmp/q/)
            DRY_RUN=1 LONG_QUEUE=/tmp/q python -u life/make_long.py
          else
            python -u life/make_long.py
          fi
      # 일요일 모음 영상(long-weekly.yml)이 쓰도록 완성 영상을 10일 보관 (공개 저장소라 무료)
      - name: 완성 영상 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test_file && 'long-test' || 'long-video' }}
          path: |
            life/long/_out/*.mp4
            life/long/_out/*-thumb.jpg
          retention-days: 10
          compression-level: 0
          if-no-files-found: ignore
      - name: 처리 기록 저장
        if: always()
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          git add -A life/long/queue life/long/done life/data/long_log.json
          git diff --cached --quiet && exit 0
          git commit -m "인생ON 긴 영상 제작 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
