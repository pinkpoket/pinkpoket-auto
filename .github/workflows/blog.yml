name: blog-post

on:
  # posts/ 에 새 글(JSON)이 올라오면 바로 발행
  push:
    branches: [main]
    paths: ["posts/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 핑크포켓 블로그 발행
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
          THREADS_URL: ${{ vars.THREADS_URL }}
        run: python -u blog_bot.py
      - name: 발행 기록 저장
        if: always()
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
          [ -f data/posted.json ] && git add data/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "블로그 발행 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
