name: blog-update

on:
  push:
    branches: [main]
    paths: ["data/update_queue.txt"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git 설정
        run: |
          git config user.name "pinkpoket-bot"
          git config user.email "pinkpoket-bot@users.noreply.github.com"
      - name: 이미지 만들기 (무료 AI)
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -u make_images.py
      - name: 이미지 올리기
        id: img
        run: |
          git add images 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "블로그 이미지 추가"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 발행된 글 고쳐 올리기
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
          THREADS_URL: ${{ vars.THREADS_URL }}
          IMAGES_SHA: ${{ steps.img.outputs.sha }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
        run: python -u update_posts.py
      - name: 큐 비우기
        if: always()
        run: |
          git add data/update_queue.txt data/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "수정 큐 비우기"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
