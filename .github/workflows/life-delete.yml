name: life-delete

on:
  # 직접 실행: 인생ON 채널의 비공개·일부공개 영상만 지움 (공개 영상은 건너뜀)
  workflow_dispatch:
    inputs:
      video_ids:
        description: "영상 ID (쉼표로)"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.LIFE_YOUTUBE_REFRESH_TOKEN }}
          YT_CHANNEL_ID: "UCkN5Ws9cI_B8fyE71-dl__Q"
          VIDEO_IDS: ${{ inputs.video_ids }}
        run: python -u life/delete_videos.py
